name: ${COMPOSE_PROJECT_NAME:?Set unique project name}
services:
  app:
    image: ${APP_IMAGE:?Set immutable GHCR image digest}
    restart: unless-stopped
    init: true
    env_file: ["${APP_ENV_FILE:?Set absolute runtime env file path}"]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      private:
      jobs:
      proxy:
        aliases: ["${APP_PROXY_ALIAS:?Set unique Caddy upstream alias}"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # Calls the app's idempotent cron endpoints every 15 minutes. Same image and
  # hardening as app, only the jobs network (no route to PostgreSQL) and only
  # CRON_SECRET in its environment.
  scheduler:
    image: ${APP_IMAGE:?Set immutable GHCR image digest}
    restart: unless-stopped
    init: true
    command: ["node", "scripts/scheduler.mjs"]
    environment:
      SCHEDULER_TARGET: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env (same value as runtime.env)}
    networks: ["jobs"]
    depends_on: ["app"]
    # The image's HEALTHCHECK probes the web server on :3000, which this
    # container doesn't run; the scheduler logs each job and restarts on exit.
    healthcheck:
      disable: true
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes: ["postgres:/var/lib/postgresql"]
    networks: ["private"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  private:
    internal: true
  jobs:
    internal: true
  proxy:
    external: true
volumes:
  postgres:
