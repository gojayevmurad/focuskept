# Render these two placeholders from LIVEKIT_API_KEY and LIVEKIT_API_SECRET.
# Compose does not interpolate mounted YAML. Never use development keys here.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
keys:
  "${LIVEKIT_API_KEY}": "${LIVEKIT_API_SECRET}"
