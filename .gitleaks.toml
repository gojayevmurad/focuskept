[extend]
useDefault = true

[allowlist]
description = "Lockfile, hosted content, and fixed test-only secrets"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''^content/''',
]
regexes = [
  '''whsec_test-secret''',
  '''isolated-ci-secret-not-used-outside-ci-123456''',
  '''testkey1234567890''',
  '''0123456789abcdef0123456789abcdef''',
]
