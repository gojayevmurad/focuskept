name: ${COMPOSE_PROJECT_NAME:?Run pnpm setup first}
services:
  app:
    build:
      context: .
      target: development
    init: true
    env_file: [.env.local]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: http://localhost:${APP_PORT:-3000}
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
  # Local job runner: same loop as production. Idle until CRON_SECRET is set in .env.local.
  scheduler:
    image: node:24-bookworm-slim
    init: true
    working_dir: /app
    command: ["node", "scripts/scheduler.mjs"]
    environment:
      SCHEDULER_TARGET: http://app:3000
      CRON_SECRET: ${CRON_SECRET:-}
    volumes: ["./scripts/scheduler.mjs:/app/scripts/scheduler.mjs:ro"]
    depends_on:
      app:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["dev_postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  test-db:
    image: postgres:18.6-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup}
      POSTGRES_DB: ${POSTGRES_DB}_test
    ports: ["127.0.0.1:${TEST_DB_PORT:-5433}:5432"]
    tmpfs: ["/var/lib/postgresql"]
volumes:
  node_modules:
  next_cache:
  dev_postgres:
