name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: focuskept
          POSTGRES_PASSWORD: focuskept
          POSTGRES_DB: focuskept_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U focuskept -d focuskept_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://focuskept:focuskept@localhost:5432/focuskept_test
      TEST_DATABASE_URL: postgres://focuskept:focuskept@localhost:5432/focuskept_test
      BETTER_AUTH_SECRET: isolated-ci-secret-not-used-outside-ci-123456
      APP_URL: http://localhost:3000
      EMAIL_MODE: preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-results
          path: test-results/
