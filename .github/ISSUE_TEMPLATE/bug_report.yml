name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately through our [security policy](https://github.com/gojayevmurad/focuskept/blob/main/SECURITY.md). Remove secrets and personal data from logs and screenshots.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example if possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, hosted or self-hosted setup, browser, operating system, and video provider.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Include relevant details with secrets and personal data removed.
