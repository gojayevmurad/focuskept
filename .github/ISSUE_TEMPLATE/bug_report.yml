name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tasks page
        2. ...
  - type: input
    id: where
    attributes:
      label: Browser, device and language
      placeholder: Chrome 131 on Android, Azerbaijani
